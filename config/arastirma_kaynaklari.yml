# Kurumlarin kendi yayin sayfalari (birincil ✅; robots.txt 20.11'de kontrol edildi). Sayfadaki yeni basliklar
# "ilk gorulme" zamaniyla kaydedilir. desen: makale baglantilarinin yol deseni.
yayin_sayfalari:
  - {ad: "ING THINK - Türkiye", kurum: "ING", url: "https://think.ing.com/tags/tag/Turkey/", desen: "/(snaps|articles|reports)/", turkiye: true}
  - {ad: "ING THINK - son yayınlar", kurum: "ING", url: "https://think.ing.com/latest/", desen: "/(articles|reports)/", turkiye: false}
# Kuresel gorunum haberleri: Turkiye suzgeci UYGULANMAZ ama baslikta gorunum/strateji kelimesi ve kurum adi aranir (◐)
gorunum_sorgulari:
  - 'outlook 2027 "Neuberger Berman" OR PGIM OR DWS OR "Columbia Threadneedle" OR Invesco'
  - 'outlook 2027 UBS OR "Morgan Stanley" OR "Goldman Sachs" OR "JPMorgan" OR BlackRock'
  - 'outlook 2027 ING OR "ABN AMRO" OR Santander OR EFG OR Barclays OR HSBC OR Amundi'
  - 'emerging markets outlook 2027'
  - '2027 görünüm raporu yatırım bankası'
