  - {ad: "Yapı Kredi Yatırım",kademe: A,  desen: "Yapı Kredi Yatırım|Yapi Kredi Yatirim|YKY",      erisim: toplayici, not: "robots PDF yasak"}
  - {ad: "Garanti BBVA Yatırım", kademe: A-, desen: "Garanti BBVA|Garanti Yatırım|Garanti Yatirim", erisim: toplayici, not: "raporlar uye girisi"}
