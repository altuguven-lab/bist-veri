# ARASTIRMA KAYNAKLARI (20.11.2026) - kurum listesi ve erisim kurallari. Salt veri, tavsiye degildir.
# Kademe (tier) Altug'un L99 cercevesinden; yeni kurum eklemek serbest, kademe degisikligi kurul karariyla.
# erisim: birincil = kurumun kendi yayini okunuyor | toplayici = hedeffiyat.com.tr | haber = yalniz basinda cikan (◐)
#         kapali = uye girisi/robots nedeniyle okunamaz (⛔)
yerli:
  - {ad: "İş Yatırım",        kademe: A,  desen: "İş Yatırım|Is Yatirim|İş Yat",                  erisim: birincil, not: "arastirma.isyatirim.com.tr RSS"}
