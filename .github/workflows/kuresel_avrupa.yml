# KURESEL GOSTERGE - AVRUPA bolumu (27.07.2026, ALTYAPI)
# Konum: .github/workflows/kuresel_avrupa.yml
# Hafta ici her gun 11:15 TSI (08:15 UTC) - Avrupa acilisindan ~1-1.5sa sonra.
name: Kuresel Gosterge - Avrupa
on:
  schedule:
    - cron: "15 8 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  avrupa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_kuresel.py avrupa
      - run: |
          git config user.name "kuresel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kuresel_gosterge.json
          git diff --staged --quiet || git commit -m "Kuresel gosterge (avrupa) $(date -u +%Y-%m-%d)"
          # 03.08 DUZELTME (tum git-yazan workflow'lara uygulandi): "fetch
          # first" carpismasi - ayni saatlerde baska bir workflow push etmisse
          # bu commit reddediliyordu. Simdi jitter'li pull --rebase + 5 deneme
          # (Pipedream'deki suru kirici deseniyle ayni mantik).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
