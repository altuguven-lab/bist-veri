# KURESEL GOSTERGE - AMERIKA bolumu (27.07.2026, ALTYAPI)
# Konum: .github/workflows/kuresel_amerika.yml
# Hafta ici her gun 16:40 TSI (13:40 UTC) - ABD acilisindan ~10dk sonra,
# BIST kapanisindan (18:00 TSI) once - seansin son saatinin oncu gostergesi.
name: Kuresel Gosterge - Amerika
on:
  schedule:
    - cron: "40 13 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  amerika:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_kuresel.py amerika
      - run: |
          git config user.name "kuresel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kuresel_gosterge.json
          git diff --staged --quiet || git commit -m "Kuresel gosterge (amerika) $(date -u +%Y-%m-%d)"
          git push
