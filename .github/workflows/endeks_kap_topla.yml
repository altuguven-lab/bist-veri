name: Endeks KAP Topla

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endeks-kap
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Topla
        run: python endeks_kap_topla.py
      - name: Kaydet
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data/endeks_kap || true
          git diff --cached --quiet && exit 0
          git commit -m "endeks KAP bildirimleri"
          git pull --rebase -X theirs
          git push
