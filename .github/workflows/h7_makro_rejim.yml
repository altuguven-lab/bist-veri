# H7 MAKRO RISK ISTAHI BAYRAGI - ELLE tetiklenir, SALT OLCUM, Pine'a dokunmaz, TAVSIYE DEGILDIR.
# Kurallar ON_KAYIT_H7.md'de (bu is akisindan ONCE commit edilmis olmali). EVDS anahtari GitHub Secret'tan.
name: H7 Makro Rejim
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h-testleri
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy PyYAML==6.0.2
      - name: On kayit dosyasi var mi
        run: test -f ON_KAYIT_H7.md || { echo "ON_KAYIT_H7.md yok"; exit 1; }
      - name: H7
        env:
          TCMB_EVDS_API_KEY: ${{ secrets.TCMB_EVDS_API_KEY }}
        run: python h7_makro_rejim.py 2> h7_teshis.log || { tail -40 h7_teshis.log; exit 1; }
      - name: Commit
        run: |
          git config user.name "h-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/h7
          git diff --staged --quiet && exit 0
          git commit -m "H7 makro rejim $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main
          done
          exit 1
