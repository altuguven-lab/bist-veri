# ANALIST KONSENSUSU ILERIYE DONUK TOPLAYICI - SALT VERI TOPLAMA.
# Her is gunu 20:30 TR (17:30 UTC) - seans kapandiktan sonra.
name: Konsensus Topla
on:
  schedule:
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: konsensus
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - name: Topla
        run: python konsensus_topla.py
      - name: Commit
        run: |
          git config user.name "konsensus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/konsensus
          git diff --staged --quiet && exit 0
          git commit -m "Konsensus anlik goruntu $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main
          done
          exit 1
