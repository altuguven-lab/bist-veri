# RSI vs XU100 BENCHMARK KIYASLAMASI (07.08.2026) - Faz V0
# Konum: .github/workflows/rsi_vs_xu100_kiyas.yml
# TEK SEFERLIK, elle tetiklenir - SALT OLCUM.
name: RSI vs XU100 Kiyas
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  kiyas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - name: XU100 kiyaslamasi calistir
        run: python rsi_vs_xu100_kiyas.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "xu100-kiyas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/rsi_vs_xu100_kiyas_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "RSI vs XU100 kiyaslamasi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
