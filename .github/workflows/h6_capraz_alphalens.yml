# H6/F5 BAGIMSIZ CAPRAZ KONTROL (alphalens) - ELLE, TEK SEFERLIK. SALT OLCUM, Pine'a dokunmaz, TAVSIYE DEGILDIR.
# Kurallar ON_KAYIT_H6_CAPRAZ.md'de (bu is akisindan ONCE commit edilmis olmali).
name: H6 Capraz Alphalens
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h-testleri
  cancel-in-progress: false
jobs:
  capraz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy PyYAML==6.0.2 alphalens-reloaded==0.5.1
      - name: On kayit var mi, daha once calisti mi
        run: |
          test -f ON_KAYIT_H6_CAPRAZ.md || { echo "ON_KAYIT_H6_CAPRAZ.md yok"; exit 1; }
          if [ -f data/h6/capraz_alphalens.json ]; then echo "Tek seferlik: sonuc zaten var, tekrar calistirilmaz"; exit 1; fi
      - name: Capraz kontrol
        run: python h6_capraz_alphalens.py
      - name: Commit
        run: |
          git config user.name "h-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/h6/capraz_alphalens.json data/h6/capraz_alphalens.md
          git diff --staged --quiet && exit 0
          git commit -m "H6 capraz alphalens $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main
          done
          exit 1
