# BIST TICK LIMIT REFERANSI (11.08.2026) - Faz V0
# Konum: .github/workflows/bist_tick_limit_referansi.yml
# TEK SEFERLIK, elle tetiklenir - SALT OLCUM, Pine'a dokunmuyor,
# Kulucka Protokolu'nu ETKILEMEZ.
name: BIST Tick Limit Referansi
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  referans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas
      - name: Referansi calistir
        run: python bist_tick_limit_referansi.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "bist-limit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sinyal_arsiv_bist_limit_kontrolu.json
          git diff --staged --quiet && exit 0
          git commit -m "BIST tick/limit referansi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
