# VERI KAYNAGI KESFI - SALT VERI TOPLAMA, elle tetiklenir. robots.txt kurallarina uyar.
name: Veri Kaynak Kesif
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: endeks-kesif
  cancel-in-progress: false
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kesif
        run: python veri_kaynak_kesif.py
      - name: Commit
        run: |
          git config user.name "kaynak-kesif-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kaynak_kesif
          git diff --staged --quiet && exit 0
          git commit -m "Veri kaynak kesif $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main
          done
          exit 1
