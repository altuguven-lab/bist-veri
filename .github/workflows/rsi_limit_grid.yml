# RSI LIMIT GRID (10.08.2026) - Faz V0
# Konum: .github/workflows/rsi_limit_grid.yml
# TEK SEFERLIK, elle tetiklenir - SALT OLCUM, Pine'a dokunmuyor.
name: RSI Limit Grid
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy pyyaml
      - name: Grid testini calistir
        run: python rsi_limit_grid.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "rsi-limit-grid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/rsi_limit_grid_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "RSI limit grid testi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
