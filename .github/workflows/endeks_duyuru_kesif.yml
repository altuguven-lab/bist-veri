# BIST ENDEKS DONEM DUYURULARI - KESIF. SALT VERI TOPLAMA, elle tetiklenir.
# id_tarama=1 secilirse duyuru ID'leri tek tek taranir (uzun surer; sayfa baglantilari bos gelirse kullanilir).
name: Endeks Duyuru Kesif
on:
  workflow_dispatch:
    inputs:
      id_tarama:
        description: "Duyuru ID taramasi (0/1)"
        default: "0"
      id_bas:
        description: "Tarama baslangic ID"
        default: "1500"
      id_bit:
        description: "Tarama bitis ID"
        default: "7700"
permissions:
  contents: write
concurrency:
  group: endeks-kesif
  cancel-in-progress: false
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kesif
        env:
          ID_TARAMA: ${{ inputs.id_tarama }}
          ID_BAS: ${{ inputs.id_bas }}
          ID_BIT: ${{ inputs.id_bit }}
        run: python endeks_duyuru_kesif.py
      - name: Commit
        run: |
          git config user.name "endeks-kesif-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/endeks_kesif
          git diff --staged --quiet && exit 0
          git commit -m "Endeks duyuru kesif $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main
          done
          exit 1
