# AKADEMIK BULGULAR TAKIBI (07.08.2026) - Faz V0
# Konum: .github/workflows/akademik_bulgular.yml
# TEK SEFERLIK, elle tetiklenir. Yeni makale eklemek icin:
#   akademik_bulgular.py'nin __main__ blogune yeni makale_ekle(...)
#   cagrisi eklenip commit'lenir, workflow tekrar tetiklenir.
name: Akademik Bulgular Takibi
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  kayit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kayitlari ekle/guncelle
        run: python akademik_bulgular.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "akademik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/akademik_bulgular.json
          git diff --staged --quiet && exit 0
          git commit -m "Akademik bulgu kaydi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
