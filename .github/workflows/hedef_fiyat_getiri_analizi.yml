# HEDEF FIYAT GETIRI ANALIZI (08.08.2026) - Faz V0
# Konum: .github/workflows/hedef_fiyat_getiri_analizi.yml
# TEK SEFERLIK, elle tetiklenir. AL/SAT tavsiyesi URETMEZ - yalniz
# hedef fiyat vs guncel fiyat matematigini gosterir.
name: Hedef Fiyat Getiri Analizi
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Analizi calistir
        run: python hedef_fiyat_getiri_analizi.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "hedef-getiri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hedef_fiyat_getiri_analizi.json
          git diff --staged --quiet && exit 0
          git commit -m "Hedef fiyat getiri analizi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1

