# KESIF - VIOP bulten gecmisi (Asama 2). Tek seferlik, yalniz elle calistirilir. Veri yazmaz, rapor yazar.
name: Kesif VIOP Gecmis
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kesif-viop-gecmis
  cancel-in-progress: false
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python kesif_viop_gecmis.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kesif/kesif_viop_gecmis.json data/kesif/kesif_viop_gecmis.md || true
          git diff --cached --quiet && exit 0
          git commit -m "Kesif: VIOP bulten gecmisi [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
