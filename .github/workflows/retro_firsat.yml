# RETRO FIRSAT ENVANTERI - v2 (23.07): haftalik otomatik + elle kosum
# Konum: .github/workflows/retro_firsat.yml
name: Retro Firsat
on:
  schedule:
    - cron: "30 15 * * 5"  # hafta kapanisi, hafta_denetim'den 15dk once
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  retro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python retro_firsat.py
      - run: |
          git config user.name "retro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/denetim/
          git diff --staged --quiet || git commit -m "Retro firsat envanteri $(date -u +%Y-%m-%d)"
          # 03.08 DUZELTME (tum git-yazan workflow'lara uygulandi): "fetch
          # first" carpismasi - ayni saatlerde baska bir workflow push etmisse
          # bu commit reddediliyordu. Simdi jitter'li pull --rebase + 5 deneme
          # (Pipedream'deki suru kirici deseniyle ayni mantik).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
