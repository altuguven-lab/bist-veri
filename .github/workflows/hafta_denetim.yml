# HAFTA KAPANISI DENETIMI (K1)
# Konum: .github/workflows/hafta_denetim.yml
# Cuma 18:45 TR (15:45 UTC) - kapanis + GUNLUK_OZET sonrasi.
# Elle kosum: Actions -> Hafta Denetimi -> Run workflow
name: Hafta Denetimi
on:
  schedule:
    - cron: "45 15 * * 5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  denetim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python hafta_denetim.py
      - name: Denetim ciktisini commit et
        run: |
          git config user.name "hafta-denetim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/denetim/
          git diff --staged --quiet && exit 0
          git commit -m "Hafta denetimi $(date -u +%Y-%m-%d)"
          # 03.08 DUZELTME: "main -> main (fetch first)" carpismasi -
          # ayni akscam baska bir workflow (golge/retro/GUNLUK_OZET)
          # push etmisse bu commit reddediliyordu. Simdi jitter'li
          # pull --rebase + yeniden deneme (Pipedream'deki suru kirici
          # deseniyle ayni mantik).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz - hata olarak isaretleniyor"
          exit 1
