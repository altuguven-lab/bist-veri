# GUNLUK GOZLEM CETVELI (09.08.2026) - Faz V0
# Konum: .github/workflows/gunluk_gozlem_cetveli.yml
# GUNLUK calisir (hafta ici, seans acilisindan ONCE - 09:50 TSI =
# 06:50 UTC). Konsolide_degerlendirme.py'nin EN SON committed
# ciktisini OKUR - kendi rutininde AYRICA tetiklenmesi GEREKMEZ.
name: Gunluk Gozlem Cetveli
on:
  schedule:
    - cron: "50 6 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cetvel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cetveli olustur
        run: python gunluk_gozlem_cetveli.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "gunluk-cetvel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gunluk_gozlem_cetveli.json data/gunluk_gozlem_cetveli.md
          git diff --staged --quiet && exit 0
          git commit -m "Gunluk gozlem cetveli $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1

