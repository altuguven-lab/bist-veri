# PORTFOY RISK ESIGI KONTROLU (03.08.2026, ALTYAPI)
# Konum: .github/workflows/portfoy_risk.yml
# saglik_kontrol.py ile ayni ritimde: hafta ici gunde 2 kez
# (09:35 / 14:35 TR = 06:35 / 11:35 UTC).
name: Portfoy Risk Esigi
on:
  schedule:
    - cron: "35 6,11 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Risk esigi kontrolu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python portfoy_risk_kontrol.py
      - name: Takip dosyasini commit et
        run: |
          git config user.name "risk-esigi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/portfoy_risk_takip.json
          git diff --staged --quiet && exit 0
          git commit -m "Risk esigi takibi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
