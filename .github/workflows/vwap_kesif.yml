# VWAP ORTALAMAYA-DONUS KESIF-BACKTEST (05.08.2026) - Faz V0
# Konum: .github/workflows/vwap_kesif.yml
# TEK SEFERLIK, elle tetiklenir - SALT OLCUM, gercek islem/sinyal uretmez.
name: VWAP Kesif Backtest
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas
      - name: VWAP kesif-backtest calistir
        run: python vwap_kesif_backtest.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "vwap-kesif-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/vwap_kesif_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "VWAP kesif-backtest $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
