# KURESEL GOSTERGE - ASYA bolumu (27.07.2026, ALTYAPI)
# Konum: .github/workflows/kuresel_asya.yml
# Hafta ici her gun 09:35 TSI (06:35 UTC) - BIST acilisindan once.
name: Kuresel Gosterge - Asya
on:
  schedule:
    - cron: "35 6 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  asya:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_kuresel.py asya
      - run: |
          git config user.name "kuresel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kuresel_gosterge.json
          git diff --staged --quiet || git commit -m "Kuresel gosterge (asya) $(date -u +%Y-%m-%d)"
          git push
