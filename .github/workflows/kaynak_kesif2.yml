name: Kaynak Kesif 2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaynak-kesif2
  cancel-in-progress: false

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kesif
        run: python kaynak_kesif2.py
      - name: Kaydet
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/kaynak_kesif2 || true
          git diff --cached --quiet && exit 0
          git commit -m "kaynak kesif 2"
          git pull --rebase -X theirs
          git push
