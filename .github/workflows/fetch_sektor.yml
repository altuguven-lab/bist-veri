# SEKTOR GOSTERGE (04.08.2026, ALTYAPI)
# Konum: .github/workflows/fetch_sektor.yml
# kuresel_asya.yml ile ayni saatte (09:35 TSI / 06:35 UTC) - dunku BIST
# sektor kapanislarini, bugunku seans baslamadan hazir tutmak icin.
name: Sektor Gosterge
on:
  schedule:
    - cron: "35 6 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sektor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - name: Sektor verisini cek
        run: python fetch_sektor.py
      - name: Commit et
        run: |
          git config user.name "sektor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sektor_gosterge.json
          git diff --staged --quiet && exit 0
          git commit -m "Sektor gosterge $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
