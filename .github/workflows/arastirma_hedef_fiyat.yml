# HEDEF FIYAT REVIZYON TAKIBI (05.08.2026) - Faz V0
# Konum: .github/workflows/arastirma_hedef_fiyat.yml
# TEK SEFERLIK, elle tetiklenir. Yeni kayit eklemek icin:
#   arastirma_hedef_fiyat.py'nin __main__ blogune yeni kayit_ekle(...)
#   cagrisi eklenip commit'lenir, sonra bu workflow tekrar tetiklenir -
#   dosya HER SEFERINDE bastan calisir (mevcut JSON'u OKUYUP uzerine
#   ekler, kayitlar birikir - _oku() zaten var olan dosyayi baz alir).
name: Arastirma Hedef Fiyat Takibi
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  kayit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kayitlari ekle/guncelle
        run: python arastirma_hedef_fiyat.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "arastirma-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/arastirma_hedef_fiyat.json
          git diff --staged --quiet && exit 0
          git commit -m "Hedef fiyat revizyon kaydi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
