# B2 FAZ V0 - SEKTOR-GUCLU-AMA-HISSE-GERIDE TESTI (17.09.2026)
# Konum: .github/workflows/b2_sektor_lider_kuyruk.yml
# ELLE tetiklenir - SALT OLCUM. Pine'a dokunmaz, kulucka sayacini etkilemez.
#
# ON KOSUL: kgs_gunluk_port.py depoda olmali (import ediyor).
#
# Cikti data/backtest/b2_sektor_lider_kuyruk_sonuc.json
name: B2 Sektor Lider-Kuyruk Testi (Faz V0)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  b2-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy
      - name: On kosul - kgs_gunluk_port.py depoda mi
        run: |
          test -f kgs_gunluk_port.py || { echo "HATA: kgs_gunluk_port.py depoda yok"; exit 1; }
      - name: B2 testini calistir
        run: python b2_sektor_lider_kuyruk.py
      - name: Sonucu commit'le
        run: |
          git config user.name "b2-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/b2_sektor_lider_kuyruk_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "B2 Faz V0: sektor lider-kuyruk sonucu $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then echo "push basarili ($i)"; exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"; exit 1
