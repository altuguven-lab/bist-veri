# KURESEL GOSTERGE - BIRLESIK (28.08.2026 KONSOLIDASYON)
# Konum: .github/workflows/kuresel_gosterge.yml
# ONCEKI DURUM: kuresel_asya.yml, kuresel_avrupa.yml, kuresel_amerika.yml
# UC AYRI dosyaydi - ayni script (fetch_kuresel.py), sadece farkli bolge
# argumaniyla cagriliyordu. Asya bacagi "35 6" saatinde fetch_sektor +
# fetch_viop + portfoy_risk + saglik_kontrol ile CAKISIYORDU (5'li yigilma,
# bkz. WORKFLOW_KONSOLIDASYON_NOTU.md). Tek dosyada birlestirildi, GitHub'a
# giden zamanli tetikleyici KAYDI 3'ten 1'e dustu. Ucu de birbirinden
# BAGIMSIZ calisir (ayri bolge/veri), hangi zaman geldiyse SADECE o job
# `github.event.schedule` ile secilip calisir - digerleri atlanir.
# Asya saati 6:35 -> 6:40'a CEKILDI (sabah_veri_paketi.yml ve
# risk_ve_saglik_paketi.yml ile cakismayi azaltmak icin). Avrupa/Amerika
# zamanlari degismedi (zaten cakisma yoktu).
name: Kuresel Gosterge
# 20.11 (paket53): schedule tetikleri ~9 saat gecikiyordu (06:40 UTC -> 16:01). Asil tetik Cloudflare kopru
# zamanlayicisi: repository_dispatch kuresel_asya (05:20 UTC), kuresel_avrupa (08:16), kuresel_amerika (13:40).
on:
  schedule:
    - cron: "40 6 * * 1-5"   # asya - BIST acilisindan once
    - cron: "15 8 * * 1-5"   # avrupa - Avrupa acilisindan ~1-1.5sa sonra
    - cron: "40 13 * * 1-5"  # amerika - ABD acilisindan ~10dk sonra
  repository_dispatch:
    types: [kuresel_asya, kuresel_avrupa, kuresel_amerika]
  workflow_dispatch:
    inputs:
      bolge:
        description: "Elle kosum icin bolge (asya|avrupa|amerika)"
        required: true
        type: choice
        options: [asya, avrupa, amerika]
permissions:
  contents: write
jobs:
  asya:
    if: github.event.schedule == '40 6 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bolge == 'asya') || (github.event_name == 'repository_dispatch' && github.event.action == 'kuresel_asya')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_kuresel.py asya
      - run: |
          # 20.11: bolgeler ayni anda calisinca ayni dosyada rebase catismasi oluyordu. Catismada yerel
          # degisiklik atilir, en son main alinir ve bolge YENIDEN cekilip yazilir (dosya bolge bazinda birlesir).
          git config user.name "kuresel-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add data/kuresel_gosterge.json
            git diff --staged --quiet && { echo "degisiklik yok"; exit 0; }
            git commit -m "Kuresel gosterge (asya) $(date -u +%Y-%m-%d)"
            if git push; then echo "push basarili (deneme $i)"; exit 0; fi
            echo "push reddedildi; main alinip asya yeniden yaziliyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git fetch origin main && git reset --hard origin/main
            python fetch_kuresel.py asya
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1

  avrupa:
    if: github.event.schedule == '15 8 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bolge == 'avrupa') || (github.event_name == 'repository_dispatch' && github.event.action == 'kuresel_avrupa')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_kuresel.py avrupa
      - run: |
          # 20.11: bolgeler ayni anda calisinca ayni dosyada rebase catismasi oluyordu. Catismada yerel
          # degisiklik atilir, en son main alinir ve bolge YENIDEN cekilip yazilir (dosya bolge bazinda birlesir).
          git config user.name "kuresel-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add data/kuresel_gosterge.json
            git diff --staged --quiet && { echo "degisiklik yok"; exit 0; }
            git commit -m "Kuresel gosterge (avrupa) $(date -u +%Y-%m-%d)"
            if git push; then echo "push basarili (deneme $i)"; exit 0; fi
            echo "push reddedildi; main alinip avrupa yeniden yaziliyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git fetch origin main && git reset --hard origin/main
            python fetch_kuresel.py avrupa
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1

  amerika:
    if: github.event.schedule == '40 13 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bolge == 'amerika') || (github.event_name == 'repository_dispatch' && github.event.action == 'kuresel_amerika')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_kuresel.py amerika
      - run: |
          # 20.11: bolgeler ayni anda calisinca ayni dosyada rebase catismasi oluyordu. Catismada yerel
          # degisiklik atilir, en son main alinir ve bolge YENIDEN cekilip yazilir (dosya bolge bazinda birlesir).
          git config user.name "kuresel-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add data/kuresel_gosterge.json
            git diff --staged --quiet && { echo "degisiklik yok"; exit 0; }
            git commit -m "Kuresel gosterge (amerika) $(date -u +%Y-%m-%d)"
            if git push; then echo "push basarili (deneme $i)"; exit 0; fi
            echo "push reddedildi; main alinip amerika yeniden yaziliyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git fetch origin main && git reset --hard origin/main
            python fetch_kuresel.py amerika
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
