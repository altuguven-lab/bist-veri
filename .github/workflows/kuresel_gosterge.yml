# KURESEL GOSTERGE - BIRLESIK (28.08.2026 KONSOLIDASYON)
# Konum: .github/workflows/kuresel_gosterge.yml
# ONCEKI DURUM: kuresel_asya.yml, kuresel_avrupa.yml, kuresel_amerika.yml
# UC AYRI dosyaydi - ayni script (fetch_kuresel.py), sadece farkli bolge
# argumaniyla cagriliyordu. Asya bacagi "35 6" saatinde fetch_sektor +
# fetch_viop + portfoy_risk + saglik_kontrol ile CAKISIYORDU (5'li yigilma,
# bkz. WORKFLOW_KONSOLIDASYON_NOTU.md). Tek dosyada birlestirildi, GitHub'a
# giden zamanli tetikleyici KAYDI 3'ten 1'e dustu. Ucu de birbirinden
# BAGIMSIZ calisir (ayri bolge/veri), hangi zaman geldiyse SADECE o job
# `github.event.schedule` ile secilip calisir - digerleri atlanir.
# Asya saati 6:35 -> 6:40'a CEKILDI (sabah_veri_paketi.yml ve
# risk_ve_saglik_paketi.yml ile cakismayi azaltmak icin). Avrupa/Amerika
# zamanlari degismedi (zaten cakisma yoktu).
name: Kuresel Gosterge
on:
  schedule:
    - cron: "40 6 * * 1-5"   # asya - BIST acilisindan once
    - cron: "15 8 * * 1-5"   # avrupa - Avrupa acilisindan ~1-1.5sa sonra
    - cron: "40 13 * * 1-5"  # amerika - ABD acilisindan ~10dk sonra
  workflow_dispatch:
    inputs:
      bolge:
        description: "Elle kosum icin bolge (asya|avrupa|amerika)"
        required: true
        type: choice
        options: [asya, avrupa, amerika]
permissions:
  contents: write
jobs:
  asya:
    if: github.event.schedule == '40 6 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bolge == 'asya')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_kuresel.py asya
      - run: |
          git config user.name "kuresel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kuresel_gosterge.json
          git diff --staged --quiet || git commit -m "Kuresel gosterge (asya) $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1

  avrupa:
    if: github.event.schedule == '15 8 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bolge == 'avrupa')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_kuresel.py avrupa
      - run: |
          git config user.name "kuresel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kuresel_gosterge.json
          git diff --staged --quiet || git commit -m "Kuresel gosterge (avrupa) $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1

  amerika:
    if: github.event.schedule == '40 13 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bolge == 'amerika')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_kuresel.py amerika
      - run: |
          git config user.name "kuresel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kuresel_gosterge.json
          git diff --staged --quiet || git commit -m "Kuresel gosterge (amerika) $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
