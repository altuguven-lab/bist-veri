# 610 GUNLUK ORTALAMA TARAMASI - ELLE tetiklenir, SALT OLCUM.
# On kosul: config/bist100_uyeler.txt depoda (100 kod, satir satir).
name: MA610 Tarama
on:
  workflow_dispatch:
    inputs:
      periyot:
        description: "Periyot (gun); birden cok icin virgul: 144,233"
        default: "610"
      tip:
        description: "SMA veya EMA"
        default: "SMA"
permissions:
  contents: write
jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas
      - name: On kosul - uye listesi depoda mi
        run: |
          test -f config/bist100_uyeler.txt || { echo "HATA uye listesi yok: config/bist100_uyeler.txt"; exit 1; }
      - name: Taramayi calistir (virgullu birden cok periyot olabilir, ornek 144,233)
        env:
          PERIYOTLAR: ${{ inputs.periyot }}
          MA_TIP: ${{ inputs.tip }}
        run: |
          for p in $(echo "$PERIYOTLAR" | tr ',' ' '); do
            echo "=== periyot $p ==="
            MA_PERIYOT=$p python ma610_tarama.py
          done
      - name: Sonucu commit'le
        run: |
          git config user.name "ma610-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ma*_tarama.json data/ma*_tarama.md
          git diff --staged --quiet && exit 0
          git commit -m "MA tarama ${{ inputs.tip }}${{ inputs.periyot }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          exit 1
