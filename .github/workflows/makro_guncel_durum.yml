# MAKRO GUNCEL DURUM (11.08.2026) - Faz V0
# Konum: .github/workflows/makro_guncel_durum.yml
# HAFTALIK calisir (Pazartesi 07:15 UTC - tcmb_evds_veri.py'den
# 15dk sonra, GUNCEL veriyi okumasi icin).
name: Makro Guncel Durum
on:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  entegrasyon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Entegrasyonu calistir
        run: python makro_guncel_durum.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "makro-guncel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/makro_guncel_durum.json
          git diff --staged --quiet && exit 0
          git commit -m "Makro guncel durum $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
