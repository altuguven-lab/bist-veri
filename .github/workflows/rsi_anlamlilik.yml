# RSI ASIRI-SATIM ISTATISTIKSEL ANLAMLILIK TESTI (07.08.2026) - Faz V0
# Konum: .github/workflows/rsi_anlamlilik.yml
# TEK SEFERLIK, elle tetiklenir. SALT ANALIZ - yeni backtest calistirmaz.
name: RSI Anlamlilik Testi
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Anlamlilik testi calistir
        run: python rsi_anlamlilik.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "rsi-anlamlilik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/rsi_anlamlilik_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "RSI anlamlilik testi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
