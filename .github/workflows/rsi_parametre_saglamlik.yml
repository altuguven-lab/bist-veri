# RSI PARAMETRE-SAGLAMLIK KONTROLU (07.08.2026) - Faz V0
# Konum: .github/workflows/rsi_parametre_saglamlik.yml
# TEK SEFERLIK, elle tetiklenir. 9 parametre kombinasyonu x 30 sembol
# oldugu icin (ama veri sembol basina BIR KEZ cekiliyor) diger
# kesiflerden biraz daha uzun surebilir.
name: RSI Parametre Saglamlik Kontrolu
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy pyyaml
      - name: Parametre-saglamlik kontrolu calistir
        run: python rsi_parametre_saglamlik.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "rsi-saglamlik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/rsi_parametre_saglamlik_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "RSI parametre-saglamlik kontrolu $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
