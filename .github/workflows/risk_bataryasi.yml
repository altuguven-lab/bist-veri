# RISK BATARYASI R1-R4 - ELLE tetiklenir, SALT OLCUM, Pine'a dokunmaz, TAVSIYE DEGILDIR.
# Kurallar ON_KAYIT_RISK.md'de (bu is akisindan ONCE commit edilmis olmali).
name: Risk Bataryasi
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h-testleri
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy PyYAML==6.0.2 requests
      - name: On kayit dosyasi var mi
        run: test -f ON_KAYIT_RISK.md || { echo "ON_KAYIT_RISK.md yok"; exit 1; }
      - name: Risk bataryasi
        env:
          TCMB_EVDS_API_KEY: ${{ secrets.TCMB_EVDS_API_KEY }}
        run: python risk_bataryasi.py
      - name: Commit
        if: always()
        run: |
          git config user.name "h-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/risk || true
          git diff --staged --quiet && exit 0
          git commit -m "Risk bataryasi $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main
          done
          exit 1
