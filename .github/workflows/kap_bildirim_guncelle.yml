# KAP BILDIRIM GUNCELLE (25.08.2026)
# Konum: .github/workflows/kap_bildirim_guncelle.yml
# UretIM - fetch_kap.py'yi calistirir, data/kap_bildirimleri.json'i
# commit'ler. bilanco_takvimi.yml ile ayni ruhta (deterministik, salt
# okunur girdiye dayali), haber_update.yml'den BAGIMSIZ.
#
# Zamanlama: hafta ici, bilanco_takvimi.yml (05:30 UTC) ile ayni
# civarda, brifingten once - 05:00 UTC (08:00 TSI).
name: KAP Bildirim Guncelle

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: pip install PyYAML==6.0.2

      - name: KAP bildirimlerini cek
        run: python fetch_kap.py

      - name: Sonucu commit'le
        run: |
          git config user.name "kap-bildirim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kap_bildirimleri.json
          git diff --staged --quiet && exit 0
          git commit -m "KAP bildirimleri $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then echo "push basarili (deneme $i)"; exit 0; fi
            echo "push reddedildi, rebase + tekrar ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"; exit 1
