# SUPERTREND ADX SWING MOMENTUM 10Y KESIF (07.08.2026) - Faz V0
# Konum: .github/workflows/supertrend_adx_swing_momentum_10y_kesif.yml
# TEK SEFERLIK, elle tetiklenir - SALT OLCUM. 10 yillik veri + 30
# sembol oldugu icin DIGERLERINDEN UZUN surebilir.
name: Supertrend ADX Swing Momentum 10Y Kesif
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy pyyaml
      - name: 10 yillik swing kesif-backtest calistir
        run: python supertrend_adx_swing_momentum_10y_backtest.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "swing-10y-kesif-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/supertrend_adx_swing_momentum_10y_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "Supertrend+ADX swing momentum 10y kesif $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
