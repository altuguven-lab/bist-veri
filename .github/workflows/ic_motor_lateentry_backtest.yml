# IC MOTOR lateEntry BACKTEST (21.09.2026)
# Konum: .github/workflows/ic_motor_lateentry_backtest.yml
# ELLE tetiklenir - SALT OLCUM. Pine'a dokunmaz.
# ON KOSUL: kgs_gunluk_port.py depoda olmali (import ediyor).
name: IC Motor lateEntry Backtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lateentry-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy
      - name: On kosul - kgs_gunluk_port.py depoda mi
        run: |
          test -f kgs_gunluk_port.py || { echo "HATA: kgs_gunluk_port.py depoda yok"; exit 1; }
      - name: Testi calistir
        run: python ic_motor_lateentry_backtest.py
      - name: Sonucu commit'le
        run: |
          git config user.name "ic-motor-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/ic_motor_lateentry_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "IC motor lateEntry backtest sonucu $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then echo "push basarili ($i)"; exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"; exit 1
