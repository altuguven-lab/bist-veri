# YABANCI ORANI OLAY ARSIVI - SALT VERI TOPLAMA. Is Yatirim gunluk raporlarinin herkese acik kismi; robots.txt'e uyar.
# Ilk doldurma ~1.400 rapor (2 calisma). Sonra her is gunu 10:20 TR (07:20 UTC) yeni raporu ekler.
name: Yabanci Oran Arsiv
on:
  schedule:
    - cron: "20 7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yabanci-oran
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Topla
        run: python yabanci_oran_arsiv.py
      - name: Commit
        run: |
          git config user.name "yabanci-oran-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/yabanci_oran_arsiv.json
          git diff --staged --quiet && exit 0
          git commit -m "Yabanci oran arsivi $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main
          done
          exit 1
