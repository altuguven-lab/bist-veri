# KESIF: BIST sektor endeksleri yfinance destegi (04.08.2026)
# Konum: .github/workflows/kesif_sektor.yml
# TEK SEFERLIK - elle tetiklenir, sonuc netlesince bu workflow'a
# gerek kalmaz (kesif_viop.yml gibi).
name: Kesif Sektor Endeks
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - name: Sektor endekslerini dene
        run: python kesif_sektor_endeks.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "kesif-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kesif/kesif_sektor_endeks.json
          git diff --staged --quiet && exit 0
          git commit -m "Kesif: sektor endeks yfinance testi"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
