# KAP BILDIRIM PROTOTIP TESTI (25.08.2026, v2)
# Konum: .github/workflows/kap_prototip_test.yml
# SALT DENEME - kap_bildirim_prototip.py hicbir dosyaya yazmaz, sadece
# konsola basar. Bu workflow da HICBIR SEYI COMMIT'LEMEZ.
#
# v2 farki: baslangic/bitis girdileri eklendi. GECMISE DONUK dogrulama
# icin - bilinen bir olayin oldugu bir pencereyi sorgulamak icin
# (ornek: MGROS'un 11-12.08 zarar aciklamasi). Ikisi de bos birakilirsa
# eskisi gibi "gun" girdisine gore bugunden geriye gider.
name: KAP Prototip Testi

on:
  workflow_dispatch:
    inputs:
      gun:
        description: "Kac gunluk pencere, bugunden geriye (baslangic/bitis BOSSA kullanilir)"
        required: false
        default: "3"
      baslangic:
        description: "Sabit pencere baslangici YYYY-MM-DD (gecmise donuk test icin, bos birakilabilir)"
        required: false
        default: ""
      bitis:
        description: "Sabit pencere bitisi YYYY-MM-DD (bos birakilirsa baslangic+3 gun)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: pip install PyYAML==6.0.2

      - name: Prototipi calistir (sabit pencere varsa onu kullan)
        run: |
          if [ -n "${{ inputs.baslangic }}" ]; then
            ARGS="--baslangic ${{ inputs.baslangic }}"
            if [ -n "${{ inputs.bitis }}" ]; then
              ARGS="$ARGS --bitis ${{ inputs.bitis }}"
            fi
          else
            ARGS="--gun ${{ inputs.gun }}"
          fi
          python kap_bildirim_prototip.py $ARGS
