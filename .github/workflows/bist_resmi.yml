# BIST RESMI VERI - borsaistanbul.com ana sayfasi (Playwright). Is gunu 18:20 TR, gunde bir kez. SALT VERI, TAVSIYE DEGILDIR.
name: BIST Resmi Veri
# 20.11 EKI: Bu depoda GUNDUZ saatlerindeki `schedule:` tetikleri guvenilmez (20.11'de 04:00-10:40 UTC arasi hic
# zamanli calisma olmadi; makro_akim_reel'in 13:15 UTC calismasi 19.11'de 21:36 UTC'de geldi). Yedek tetik:
# her 30 dk dis tetikle (repository_dispatch) calisan "BIST Veri Guncelleme" bittiginde, yalniz asagidaki
# UTC pencerelerinde (tetikleyen calismanin baslama saati) bu is de calisir. schedule ayrica durur.
on:
  schedule:
    - cron: "20 15 * * 1-5"
  workflow_run:
    workflows: ["BIST Veri Guncelleme"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bist-resmi
  cancel-in-progress: false
jobs:
  oku:
    if: github.event_name != 'workflow_run' || contains(github.event.workflow_run.created_at, 'T15:3')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - name: Oku
        run: python bist_resmi.py
      - name: Commit
        if: always()
        run: |
          git config user.name "bist-resmi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bist_resmi.json data/bist_resmi_ham
          [ -f data/bist_resmi_gecmis.json ] && git add data/bist_resmi_gecmis.json
          git diff --staged --quiet && exit 0
          git commit -m "BIST resmi veri $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
