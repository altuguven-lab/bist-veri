# BILESIK UYUM SKORU v3 - SEKTOR KAPSAMI GENISLETILMIS (25.09.2026)
# Konum: .github/workflows/bilesik_uyum_skoru_v3.yml
# ELLE tetiklenir - SALT TARAMA (backtest degil). Pine'a dokunmaz, alarm uretmez.
# ON KOSUL: kgs_gunluk_port.py depoda olmali (import ediyor).
name: Bilesik Uyum Skoru v3 Taramasi

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bilesik-uyum-skoru-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy
      - name: On kosul - kgs_gunluk_port.py depoda mi
        run: |
          test -f kgs_gunluk_port.py || { echo "HATA: kgs_gunluk_port.py depoda yok"; exit 1; }
      - name: Taramayi calistir
        run: python bilesik_uyum_skoru_v3.py
      - name: Sonucu commit'le
        run: |
          git config user.name "bilesik-uyum-skoru-v3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/bilesik_uyum_skoru_v3_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "Bilesik uyum skoru v3 taramasi $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then echo "push basarili ($i)"; exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"; exit 1
