# KAZANC SURPRIZI REVERSAL (10.08.2026) - Faz V0
# Konum: .github/workflows/kazanc_surprizi_reversal.yml
# HAFTALIK calisir (Pazartesi 07:15 UTC = 10:15 TSI, geri_donus_
# adaylari.py'den 15dk sonra) - kar surprizi sikligi zaten dusuk
# (ceyreklik bilancolar), gunluk calismaya gerek yok.
name: Kazanc Surprizi Reversal
on:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas
      - name: Taramayi calistir
        run: python kazanc_surprizi_reversal.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "kazanc-reversal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kazanc_surprizi_reversal.json
          git diff --staged --quiet && exit 0
          git commit -m "Kazanc surprizi reversal taramasi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
