# ASYA ONCU GOSTERGE (27.07.2026, ALTYAPI)
# Konum: .github/workflows/asya_oncu.yml
# BIST acilisindan (10:00 TSI) once, hafta ici her sabah 09:35 TSI (06:35 UTC).
name: Asya Oncu Gosterge
on:
  schedule:
    - cron: "35 6 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  asya:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python fetch_asya.py
      - run: |
          git config user.name "asya-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/asya_oncu.json
          git diff --staged --quiet || git commit -m "Asya oncu gosterge $(date -u +%Y-%m-%d)"
          # 03.08 DUZELTME (tum git-yazan workflow'lara uygulandi): "fetch
          # first" carpismasi - ayni saatlerde baska bir workflow push etmisse
          # bu commit reddediliyordu. Simdi jitter'li pull --rebase + 5 deneme
          # (Pipedream'deki suru kirici deseniyle ayni mantik).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
