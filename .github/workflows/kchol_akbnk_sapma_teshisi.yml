# KCHOL AKBNK SAPMA TESHISI (10.08.2026) - Faz V0
# Konum: .github/workflows/kchol_akbnk_sapma_teshisi.yml
# TEK SEFERLIK, elle tetiklenir - SALT TESHIS, Pine'a dokunmuyor.
name: KCHOL AKBNK Sapma Teshisi
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  teshis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas
      - name: Teshisi calistir
        run: python kchol_akbnk_sapma_teshisi.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "sapma-teshisi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/kchol_akbnk_sapma_teshisi_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "KCHOL AKBNK sapma teshisi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
