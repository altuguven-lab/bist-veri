# VERI ARSIVI (gunluk, 19:20 TR is gunleri) - SALT VERI TOPLAMA. Ayrintilar veri_arsivi.py basinda.
name: Veri Arsivi Gunluk
on:
  schedule:
    - cron: "20 16 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: veri-arsivi
  cancel-in-progress: false
jobs:
  arsiv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy
      - name: Arsiv
        env:
          VERI_KIP: gunluk
          MAX_GUN: ${{ inputs.max_gun || '900' }}
        run: python veri_arsivi.py
      - name: Commit
        if: always()
        run: |
          git config user.name "veri-arsivi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/arsiv || true
          git diff --staged --quiet && exit 0
          git commit -m "Veri arsivi gunluk $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main
          done
          exit 1
