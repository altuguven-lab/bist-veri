name: BIST Veri Guncelleme

# 28.08 DUZELTME (v2 - harici cron KURULMADAN otomatik): 27-28.08
# tesbitinde bu workflow saatlerce (bir seferinde ~18 saat) hic
# tetiklenmedi. Kok neden GitHub'in zamanlayicisinin kendisi degil,
# DEPODAKI ASIRI ZAMANLI IS YUKUYDU: 24 ayri workflow ayni depoda
# `schedule:` kullaniyordu, bircogu ayni dakikada cakisiyordu (bkz.
# WORKFLOW_KONSOLIDASYON_NOTU.md). O gun ayni konsolidasyonla 24 -> 12
# zamanli dosyaya inildi ve TUM ayni-dakika cakismalari kaldirildi.
# `schedule:` bu yuzden GERI EKLENDI - artik rekabet etmiyor. Harici
# cron/PAT kurulumu GEREKMIYOR. `repository_dispatch` de DURUYOR
# (zarasiz, ileride harici bir tetikleyici eklemek istenirse hazir
# durur). saglik_kontrol.py (risk_ve_saglik_paketi.yml icinde) hala
# devrede - bu, GitHub yine de bir kosuyu atlarsa (nadiren, global
# yuk) bunu 2 saat icinde Issue acarak yakalayan guvenlik agidir; o
# Issue gelirse "Run workflow" ile elle tetiklemek yeterlidir.
#
# 05.08 DUZELTME (eski, hala gecerli): saatte 4 kez (her 15dk) GitHub'in
# kendi belgeledigi 'yuksek yukte sessizce atlanabilir' esigindeydi -
# saglik_kontrol.py GERCEK bir arizayi (69 dk gecikme) haftalardir dogru
# bildiriyordu, biz Actions kirmizisini gormezden gelmisiz. Saatte 2'ye
# dusuruldu.
on:
  schedule:
    - cron: "4,34 7-15 * * 1-5"
  repository_dispatch:
    types: [bist_veri_tetikle]
  workflow_dispatch: {}

jobs:
  guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: BIST verisini cek
        run: python fetch_bist.py

      - name: Commit ve push
        run: |
          git config user.name "bist-veri-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bist_quotes.json data/bist_intraday.json
          git diff --staged --quiet || git commit -m "Otomatik veri guncelleme $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 03.08 DUZELTME (tum git-yazan workflow'lara uygulandi): "fetch
          # first" carpismasi - ayni saatlerde baska bir workflow push etmisse
          # bu commit reddediliyordu. Simdi jitter'li pull --rebase + 5 deneme
          # (Pipedream'deki suru kirici deseniyle ayni mantik).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
