name: BIST Veri Guncelleme

# 05.08 DUZELTME: saatte 4 kez (her 15dk) GitHub'in kendi belgeledigi
# 'yuksek yukte sessizce atlanabilir' esigindeydi - saglik_kontrol.py
# GERCEK bir arizayi (69 dk gecikme) haftalardir dogru bildiriyordu,
# biz Actions kirmizisini gormezden gelmisiz. Saatte 2'ye dusuruldu.
on:
  schedule:
    - cron: "4,34 7-15 * * 1-5"
  workflow_dispatch: {}

jobs:
  guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: BIST verisini cek
        run: python fetch_bist.py

      - name: Commit ve push
        run: |
          git config user.name "bist-veri-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bist_quotes.json data/bist_intraday.json
          git diff --staged --quiet || git commit -m "Otomatik veri guncelleme $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 03.08 DUZELTME (tum git-yazan workflow'lara uygulandi): "fetch
          # first" carpismasi - ayni saatlerde baska bir workflow push etmisse
          # bu commit reddediliyordu. Simdi jitter'li pull --rebase + 5 deneme
          # (Pipedream'deki suru kirici deseniyle ayni mantik).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
