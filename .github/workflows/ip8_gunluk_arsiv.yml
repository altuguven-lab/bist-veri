name: IP8 gunluk sinyal arsivi

# 15.09.2026 - denetim maddesi "Python arşivleyiciyi çalıştıran GitHub
# Actions yok" uzerine eklendi. TradingView alarmi (yeniGun) piyasa
# kapanisindan hemen sonra tetiklenir - saat, alarmin gercekte ne zaman
# geldigine gore ayarlanmali (asagidaki "30 16 * * 1-5" ~19:30 TRT'dir,
# UTC+3 fark alinarak; TRT saatiniz degisirse cron'u guncelleyin).
on:
  schedule:
    - cron: "30 16 * * 1-5"   # Pazartesi-Cuma, 16:30 UTC (~19:30 TRT)
  workflow_dispatch: {}        # elle de calistirilabilsin diye

jobs:
  ip8-arsiv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install yfinance

      - name: Arsivle ve dogrula
        run: python ip8_sinyal_arsiv_gunluk.py --ingest --dogrula

      - name: Degisiklikleri commit'le
        run: |
          # 06.10 DUZELTME: data/ip8_sinyal_arsiv.json YOKKEN (IP8 webhook'u
          # henuz data/ip8_sinyal_latest.json yazmadiysa betik dosyayi olusturmaz)
          # `git add <olmayan yol>` "fatal: pathspec" ile exit 128 veriyordu.
          # Artik dosya yoksa temiz cikis; push da rebase+5 deneme ile.
          if [ ! -f data/ip8_sinyal_arsiv.json ]; then
            echo "data/ip8_sinyal_arsiv.json yok - IP8 verisi henuz gelmemis, commit atlandi"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ip8_sinyal_arsiv.json
          git diff --cached --quiet && exit 0
          git commit -m "IP8 gunluk arsiv guncellemesi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "push basarili (deneme $i)"; exit 0; fi
            echo "push reddedildi, rebase + tekrar ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"; exit 1
