name: Haber Akisi Guncelle

on:
  schedule:
    # 03.08 DUZELTME: 30dk'da bir (gunde 48 kez) GitHub'in kendi
    # belgeledigi "yuksek yukte sessizce atlanabilir" riskine cok
    # aciktir - 8+ saatlik sessiz bosluklar yasandi (script hatasi
    # degil, GitHub'in zamanlayici guvenilirligi). Saatte bire
    # dusuruldu - haber akisi icin zaten yeterli, GitHub'in onerdigi
    # "15 dakikadan sik olmasin" esiginin rahat altinda.
    - cron: "13 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  haber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: pip install feedparser

      - name: Haberleri cek
        run: python fetch_news.py

      - name: Commit ve push
        run: |
          git config user.name "bist-veri-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/haber_akisi.json
          git diff --staged --quiet && exit 0
          git commit -m "Otomatik haber guncelleme $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 03.08 DUZELTME: diger 9 workflow'la ayni "fetch first" carpismasi
          # riski - gunde 48 kez calistigi icin en yuksek carpisma ihtimaline
          # sahip workflow. 5 denemeli jitter'li pull --rebase + push.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
