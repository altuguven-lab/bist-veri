# HAFTA KAPANISI PAKETI (28.08.2026 KONSOLIDASYON)
# Konum: .github/workflows/hafta_kapanisi.yml
# ONCEKI DURUM: retro_firsat.yml (Cuma 15:30) ve hafta_denetim.yml
# (Cuma 15:45) AYRI dosyalardi - yorumda ACIKCA yaziyordu: "retro_firsat,
# hafta_denetim'den 15dk once" (retro_firsat.yml) ve hafta_denetim K1
# denetiminin retro'nun GUNCEL ciktisini gormesi bekleniyordu. Ayrica
# retro_firsat 15:30'da GUNLUK rsi_gozlem ile, hafta_denetim 15:45'te
# GUNLUK sinyal_arsiv_gunluk ile TAM CAKISIYORDU.
# 28.08 tesbiti: 15 dakikalik wall-clock varsayimi GitHub yuklenince
# saatlerce kayabiliyor (bkz. WORKFLOW_KONSOLIDASYON_NOTU.md) - yani bu
# STATED sira garantisi aslinda hic garanti degildi.
# YENI TASARIM: iki adim `needs:` ile GERCEKTEN sirali - hafta_denetim
# job'i retro_firsat job'i (commit dahil) BITMEDEN baslamiyor. Tek
# tetikleyici: Cuma 15:20 UTC (seans_kapanisi.yml ile ayni saat, gunluk
# paketlerle cakismiyor cunku bu SADECE Cuma calisiyor).
name: Hafta Kapanisi Paketi
on:
  schedule:
    - cron: "20 15 * * 5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  retro_firsat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - run: python retro_firsat.py
      - run: |
          git config user.name "retro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/denetim/
          git diff --staged --quiet || git commit -m "Retro firsat envanteri $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1

  hafta_denetim:
    needs: retro_firsat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66
      - name: Inbox kayitlarini birlestir
        run: python inbox_birlestir.py
      - run: python hafta_denetim.py
      - name: Denetim ciktisini commit et
        run: |
          git config user.name "hafta-denetim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/denetim/ data/tv_alerts_latest.json
          git diff --staged --quiet && exit 0
          git commit -m "Hafta denetimi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz - hata olarak isaretleniyor"
          exit 1
