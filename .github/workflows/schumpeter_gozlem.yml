# SCHUMPETER GOZLEM KATMANI (11.10.2026)
# Konum: .github/workflows/schumpeter_gozlem.yml
# SALT OLCUM - Pine'a dokunmaz, alarm uretmez (Kulucka/IP-3 uyumlu).
# KAP verisi 45 gun saklandigi icin haftada en az bir kez calismali (defter birikir).
name: Schumpeter Gozlem

on:
  schedule:
    - cron: "30 17 * * 5"   # Cuma 20:30 TR (hafta kapanisi sonrasi)
    - cron: "0 6 * * 0"     # Pazar 09:00 TR
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gozlem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy
      - name: Gozlemi calistir
        run: python schumpeter_gozlem.py
      - name: Sonucu commit'le
        run: |
          git config user.name "schumpeter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/schumpeter_gozlem.json data/schumpeter_kap_defter.json
          [ -f schumpeter_gozlem.md ] && git add schumpeter_gozlem.md || true
          git diff --staged --quiet && exit 0
          git commit -m "Schumpeter gozlem $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "push basarili ($i)"; exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"; exit 1
