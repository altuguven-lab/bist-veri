# TEMEL VERI TOPLAYICI (14.10.2026) - Konum: .github/workflows/temel_veri_topla.yml
# SALT OLCUM. Is Yatirim MaliTablo ham verisini data/temel/ altina yazar.
name: Temel Veri Topla

on:
  workflow_dispatch:
    inputs:
      kesif:
        description: "1 = kesif (4 sembol, ham kalem listesi), 0 = tam (30 sembol)"
        default: "1"
  schedule:
    - cron: "0 5 * * 1"   # Pazartesi 08:00 TR (tam mod; kesif tamamlanana kadar kapali tutulabilir)

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Topla
        env:
          KESIF: ${{ github.event.inputs.kesif || '0' }}
        run: python temel_veri_topla.py
      - name: Commit
        run: |
          git config user.name "temel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/temel
          git diff --staged --quiet && exit 0
          git commit -m "Temel veri $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "push basarili ($i)"; exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"; exit 1
