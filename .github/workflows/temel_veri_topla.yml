# TEMEL VERI + CARPAN GOZLEMI (14.10.2026) - Konum: .github/workflows/temel_veri_topla.yml
# SALT OLCUM. Is Yatirim MaliTablo ham verisi -> data/temel/, ardindan F/K ve PD/DD (TL ve USD) hesabi.
name: Temel Veri Topla

on:
  workflow_dispatch:
    inputs:
      kesif:
        description: "1 = kesif (4 sembol), 0 = tam (30 sembol + carpan hesabi)"
        default: "0"
  schedule:
    - cron: "0 5 * * 1"   # Pazartesi 08:00 TR

permissions:
  contents: write

# 26.10 EKI: Deger Tarama ile ayni dosyalara yazar; ayni anda calismasinlar.
concurrency:
  group: temel-veri
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy
      - name: Topla
        env:
          KESIF: ${{ github.event.inputs.kesif || '0' }}
        run: python temel_veri_topla.py
      - name: Carpan hesapla
        if: ${{ (github.event.inputs.kesif || '0') == '0' }}
        run: python temel_carpan_gozlem.py
      - name: Holding NAD hesapla
        if: ${{ (github.event.inputs.kesif || '0') == '0' }}
        continue-on-error: true
        run: python holding_nad_gozlem.py
      - name: Commit
        run: |
          git config user.name "temel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/temel
          [ -f data/temel_carpan.json ] && git add data/temel_carpan.json || true
          [ -f temel_carpan.md ] && git add temel_carpan.md || true
          [ -f data/holding_nad.json ] && git add data/holding_nad.json || true
          [ -f holding_nad.md ] && git add holding_nad.md || true
          git diff --staged --quiet && exit 0
          git commit -m "Temel veri ve carpan $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "push basarili ($i)"; exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"; exit 1
