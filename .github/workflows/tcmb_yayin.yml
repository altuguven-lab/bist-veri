# TCMB YAYIN VE TAKVIM TAKIBI - is gunu 10:20, 14:50, 17:20 TR. SALT VERI, TAVSIYE DEGILDIR.
name: TCMB Yayin Takibi
# 20.11 EKI: Bu depoda GUNDUZ saatlerindeki `schedule:` tetikleri guvenilmez (20.11'de 04:00-10:40 UTC arasi hic
# zamanli calisma olmadi; makro_akim_reel'in 13:15 UTC calismasi 19.11'de 21:36 UTC'de geldi). Yedek tetik:
# her 30 dk dis tetikle (repository_dispatch) calisan "BIST Veri Guncelleme" bittiginde, yalniz asagidaki
# UTC pencerelerinde (tetikleyen calismanin baslama saati) bu is de calisir. schedule ayrica durur.
on:
  schedule:
    - cron: "20 7 * * 1-5"
    - cron: "50 11 * * 1-5"
    - cron: "20 14 * * 1-5"
  workflow_run:
    workflows: ["BIST Veri Guncelleme"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tcmb-yayin
  cancel-in-progress: false
jobs:
  topla:
    if: github.event_name != 'workflow_run' || contains(github.event.workflow_run.created_at, 'T07:3') || contains(github.event.workflow_run.created_at, 'T12:0') || contains(github.event.workflow_run.created_at, 'T14:3')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install feedparser==6.0.11 playwright==1.63.0 && python -m playwright install --with-deps chromium
      - name: Topla
        run: python tcmb_yayin.py
      - name: Commit
        if: always()
        run: |
          git config user.name "tcmb-yayin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tcmb_yayin.json data/tcmb_yayin.md data/tcmb_yayin_ham 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "TCMB yayin $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
