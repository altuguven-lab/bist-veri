# B1 FAZ V0 - KGS GUNLUK-BAR YAKLASIK PORTU (17.09.2026)
# Konum: .github/workflows/kgs_gunluk_port.yml
# ELLE tetiklenir - SALT OLCUM. Sinyal uretmez, Pine'a dokunmaz, kulucka
# sayacini etkilemez.
#
# Cikti data/backtest/kgs_gunluk_port_sonuc.json - GOSTERGE NITELIGINDE
# yaklasik kopya, TEK BASINA hicbir uretim agirlik degisikligine
# GEREKCE OLAMAZ (bkz. script'in kendi durustluk notu).
name: B1 KGS Gunluk Port (Faz V0)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  kgs-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # yfinance surumu diger olcum workflow'lariyla AYNI tutulur -
      # surum ayrismasi olcumleri kiyaslanamaz hale getirir.
      - run: pip install yfinance==0.2.66 pandas numpy

      - name: KGS gunluk port script'ini calistir
        run: python kgs_gunluk_port.py

      - name: Sonucu commit'le
        run: |
          git config user.name "kgs-port-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/kgs_gunluk_port_sonuc.json
          git diff --staged --quiet && exit 0
          git commit -m "B1 Faz V0: KGS gunluk port sonucu $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then echo "push basarili (deneme $i)"; exit 0; fi
            echo "push reddedildi, rebase + tekrar ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"; exit 1
