# FON KRIZI DIRENC TARAMASI - ELLE tetiklenir, SALT OLCUM.
# On kosul: config/bist100_uyeler.txt ve ma610_tarama.py depoda.
name: Direnc Tarama
on:
  workflow_dispatch:
    inputs:
      kriz_oncesi:
        description: "Kriz oncesi referans gunu (YYYY-AA-GG)"
        default: "2026-09-15"
permissions:
  contents: write
jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas
      - name: Taramayi calistir
        env:
          KRIZ_ONCESI: ${{ inputs.kriz_oncesi }}
        run: python direnc_tarama.py
      - name: Sonucu commit'le
        run: |
          git config user.name "direnc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/direnc_tarama.json data/direnc_tarama.csv
          git diff --staged --quiet && exit 0
          git commit -m "Direnc tarama $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          exit 1
