# KESIF: CDS kaynagi (19.11.2026) - elle, bir kez. Sonuc data/kesif/cds.json; Claude inceler, sonra toplayici yazilir.
name: Kesif CDS
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python kesif_cds.py
      - name: Commit
        run: |
          git config user.name "kesif-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kesif/ || true
          git diff --staged --quiet && exit 0
          git commit -m "Kesif CDS $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
