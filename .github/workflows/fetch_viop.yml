# FAZ V1 - GUNLUK VIOP VERISI (04.08.2026, ALTYAPI)
# Konum: .github/workflows/fetch_viop.yml
# VIOP normal seansi 09:20-09:30 TSI'de acilir, BIST 10:00 TSI'de.
# 09:35 TSI (06:35 UTC): VIOP acildiktan sonra, BIST'ten once - "acilis
# oncesi brifing" icin veri hazir olsun diye.
# NOT: gunluk bulten dosyasi genelde ONCEKI GUN kapanisinin ozeti -
# yani bu kosum "bugunku VIOP acilis fiyati" degil, "dunku VIOP
# kapanisi" verir (fetch_viop.py kendi icinde en son mevcut gunu bulur).
name: VIOP Gunluk Veri
on:
  schedule:
    - cron: "35 6 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  viop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: VIOP verisini cek
        run: python fetch_viop.py
      - name: Commit et
        run: |
          git config user.name "viop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/viop_analiz.json
          git diff --staged --quiet && exit 0
          git commit -m "VIOP gunluk veri $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
