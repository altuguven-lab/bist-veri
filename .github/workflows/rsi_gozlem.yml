# RSI GOZLEM DEFTERI (07.08.2026) - Faz V0
# Konum: .github/workflows/rsi_gozlem.yml
# GUNLUK calisir (hafta ici, seans kapanisindan sonra, 18:30 TSI =
# 15:30 UTC). GERCEK PARA/ISLEM/UYARI URETMEZ - yalniz SANAL pozisyon
# takibi, defter guncellemesi.
name: RSI Gozlem Defteri
on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  gozlem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy pyyaml
      - name: Gozlem defterini guncelle
        run: python rsi_gozlem.py
      - name: Sonuclari commit'le
        run: |
          git config user.name "rsi-gozlem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rsi_gozlem_defteri.json
          git diff --staged --quiet && exit 0
          git commit -m "RSI gozlem defteri guncelleme $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
