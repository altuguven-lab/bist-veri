# IP-1 + IP-2 BACKTEST PAKETI
# Konum: .github/workflows/backtest.yml (mevcut dosyanin uzerine yazilir)
# Sadece elle tetiklenir. Sonuclar: data/backtest/
name: Olay Penceresi Backtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklar
        run: pip install yfinance pandas numpy

      - name: IP-1 olay penceresi
        run: python olay_penceresi.py

      - name: IP-2 iskelet karakter haritasi
        run: python ip2_iskelet.py

      - name: Sonuclari commit'le
        run: |
          git config user.name "bist-veri-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/backtest/
          git diff --staged --quiet || git commit -m "IP-1/IP-2 backtest sonuclari $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 03.08 DUZELTME (tum git-yazan workflow'lara uygulandi): "fetch
          # first" carpismasi - ayni saatlerde baska bir workflow push etmisse
          # bu commit reddediliyordu. Simdi jitter'li pull --rebase + 5 deneme
          # (Pipedream'deki suru kirici deseniyle ayni mantik).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push basarili (deneme $i)"
              exit 0
            fi
            echo "push reddedildi, rebase + tekrar deneniyor ($i/5)"
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase origin main
          done
          echo "5 denemeden sonra push basarisiz"
          exit 1
