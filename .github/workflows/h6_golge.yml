# H6 GOLGE IZLEME - SALT OLCUM, Pine'a dokunmaz, TAVSIYE DEGILDIR.
# Kurallar ON_KAYIT_H6_GOLGE.md'de. Her is gunu calisir; ay bitince o ayin listelerini dondurur,
# dondurulmus listelerin aylik performansini gunceller. Ay icinde calisirsa yalniz okur/gunceller.
name: H6 Golge Izleme
on:
  schedule:
    - cron: "40 6 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h6-golge
  cancel-in-progress: false
jobs:
  golge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==0.2.66 pandas numpy PyYAML==6.0.2
      - name: On kayit dosyasi var mi
        run: test -f ON_KAYIT_H6_GOLGE.md || { echo "ON_KAYIT_H6_GOLGE.md yok"; exit 1; }
      - name: H6 golge
        run: python h6_golge.py
      - name: Commit
        run: |
          git config user.name "h6-golge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/h6/golge.json data/h6/golge.md
          git diff --staged --quiet && exit 0
          git commit -m "H6 golge izleme $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main
          done
          exit 1
