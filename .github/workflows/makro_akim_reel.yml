# MAKRO AKIM VE REEL FAIZ (19.11.2026) - SALT OLCUM. Ayrintilar makro_akim_reel.py basinda.
# TCMB menkul kiymet istatistikleri Persembe yayimlanir; anket aylik. Hafta ici her gun 16:15 TR'de bakar,
# veri degismediyse commit olusmaz.
name: Makro Akim Reel
# 20.11 EKI: Bu depoda GUNDUZ saatlerindeki `schedule:` tetikleri guvenilmez (20.11'de 04:00-10:40 UTC arasi hic
# zamanli calisma olmadi; makro_akim_reel'in 13:15 UTC calismasi 19.11'de 21:36 UTC'de geldi). Yedek tetik:
# her 30 dk dis tetikle (repository_dispatch) calisan "BIST Veri Guncelleme" bittiginde, yalniz asagidaki
# UTC pencerelerinde (tetikleyen calismanin baslama saati) bu is de calisir. schedule ayrica durur.
on:
  schedule:
    - cron: "15 13 * * 1-5"
  workflow_run:
    workflows: ["BIST Veri Guncelleme"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cek:
    if: github.event_name != 'workflow_run' || contains(github.event.workflow_run.created_at, 'T13:3')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: EVDS
        env:
          TCMB_EVDS_API_KEY: ${{ secrets.TCMB_EVDS_API_KEY }}
        run: python makro_akim_reel.py
      - name: Commit
        run: |
          git config user.name "makro-akim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/makro_akim_reel.json data/makro_akim_reel.md || true
          # yalniz uretim zamani degistiyse commit atma: serilerde degisiklik var mi bak
          if git diff --staged --quiet -- data/makro_akim_reel.md; then git reset -q; exit 0; fi
          git commit -m "Makro akim reel $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 8) + 3 ))
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
